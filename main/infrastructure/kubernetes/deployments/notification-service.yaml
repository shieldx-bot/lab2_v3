apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: course-reg-exp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notifier
        image: your-registry/notification-service:latest