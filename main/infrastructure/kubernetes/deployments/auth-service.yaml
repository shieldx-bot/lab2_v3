apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: course-reg-exp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: your-registry/auth-service:latest
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: course-reg-exp
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081