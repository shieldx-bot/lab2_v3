apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: course-reg-exp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api
        image: your-registry/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: METHOD
          valueFrom:
            configMapKeyRef:
              name: experiment-config
              key: method
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8080