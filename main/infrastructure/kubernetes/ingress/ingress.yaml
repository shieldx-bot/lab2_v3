apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: course-reg-exp
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - dangky.university.edu.vn
    secretName: tls-secret
  rules:
  - host: dangky.university.edu.vn
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80